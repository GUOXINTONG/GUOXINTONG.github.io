    <rect x="337" y="144" width="38" height="38" rx="9" fill="url(#teal)"/>
    <rect x="384" y="144" width="38" height="38" rx="9" fill="url(#violet)"/>
    <g stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".95">
      <path d="M300 157H318M300 163H314M300 169H318"/>
      <path d="M347 172V160M356 172V154M365 172V164"/>
      <circle cx="403" cy="163" r="7"/><path d="M403 152V156M403 170V174M392 163H396M410 163H414"/>
    </g>
