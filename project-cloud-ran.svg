<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Radio tower streaming signals to virtualized RAN functions in the cloud">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#e9f0fb"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7cff"/><stop offset="1" stop-color="#2647c9"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6d4ee0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e3a8a" flood-opacity=".12"/></filter>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <circle cx="400" cy="70" r="130" fill="#4f7cff" opacity=".06"/>
  <circle cx="60" cy="290" r="90" fill="#14b8a6" opacity=".06"/>
  <g font-family="'JetBrains Mono',Menlo,monospace">
    <circle cx="32" cy="32" r="4" fill="#2f5bea"/>
    <text x="44" y="36" font-size="11" letter-spacing="1.5" fill="#2f5bea">CLOUD RAN</text>
  </g>

  <path d="M48 238H176" stroke="#c3d0e6" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#1c2b45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M84 236L112 108L140 236"/>
    <path d="M93 196H131M100 164H124M106 136H118M90 214L124 164M134 214L100 164"/>
  </g>
  <circle cx="112" cy="100" r="7" fill="url(#blue)"/>
  <g fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round">
    <path d="M95 82A24 24 0 0 0 95 118M129 82A24 24 0 0 1 129 118"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M82 70A42 42 0 0 0 82 130M142 70A42 42 0 0 1 142 130" opacity=".6"><animate attributeName="opacity" values=".6;.15;.6" dur="2.4s" begin=".3s" repeatCount="indefinite"/></path>
    <path d="M69 58A60 60 0 0 0 69 142M155 58A60 60 0 0 1 155 142" opacity=".3"><animate attributeName="opacity" values=".3;.05;.3" dur="2.4s" begin=".6s" repeatCount="indefinite"/></path>
  </g>

  <path id="link" d="M164 150C200 150 214 158 254 158" fill="none" stroke="#8aa3d6" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>
  <circle r="4" fill="#2f5bea"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#link"/></animateMotion></circle>
  <circle r="4" fill="#14b8a6"><animateMotion dur="1.8s" begin=".9s" repeatCount="indefinite"><mpath href="#link"/></animateMotion></circle>

  <path d="M262 206H432A36 36 0 0 0 428 134A54 54 0 0 0 326 108A42 42 0 0 0 264 150A28 28 0 0 0 262 206Z" fill="#fff" stroke="#c3d0e6" stroke-width="2" filter="url(#shadow)"/>
  <g>
